name: Validate
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: pip check
      - name: Five concurrent requests through real API and worker
        env:
          REDIS_URL: redis://localhost:6379/0
          API_KEY: ci-only-api-key
          APPROVAL_KEY: ci-only-approval-key
          AGENT_MODE: offline
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          API_PID=$!
          python -m app.worker > /tmp/worker.log 2>&1 &
          WORKER_PID=$!
          trap 'kill $API_PID $WORKER_PID || true; cat /tmp/api.log; cat /tmp/worker.log' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 1
          done
          python scripts/load_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: offline-load-test
          path: output/load_test.json
